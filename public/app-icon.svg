      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.133 0 0 0 0 0.827 0 0 0 0 0.933 0 0 0 0.8 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <clipPath id="rounded">
      <rect x="44" y="44" width="424" height="424" rx="72"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#020712"/>
