<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Vectori browser logo</title>
  <desc id="desc">Dark aerospace app icon with an aircraft, satellite, orbit arc, and engineering gear.</desc>
  <defs>
    <linearGradient id="tile" x1="76" y1="54" x2="438" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#162A40"/>
      <stop offset="0.55" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1B35"/>
    </linearGradient>
    <linearGradient id="blue" x1="264" y1="262" x2="462" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1137B8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="metal" x1="178" y1="204" x2="318" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8EA0B6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
