    <g clip-path="url(#rounded)" opacity="0.28">
      <path d="M0 96h512M0 160h512M0 224h512M0 288h512M0 352h512M0 416h512M96 0v512M160 0v512M224 0v512M288 0v512M352 0v512M416 0v512" stroke="#476581" stroke-width="1"/>
